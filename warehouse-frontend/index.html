<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
<header>
    <h1>Product Catalog</h1>
</header>

<main>
    <!-- Боковая панель фильтров -->
    <aside class="filter-sidebar">
        <h2>Filters</h2>

        <!-- Фильтр по типу -->
        <div class="filter-group">
            <label>Product Type</label>
            <div>
                <label><input type="checkbox" name="type" value="laptop"> Laptop</label>
                <label><input type="checkbox" name="type" value="smartphone"> Smartphone</label>
                <label><input type="checkbox" name="type" value="headphones"> Headphones</label>
            </div>
        </div>

        <!-- Фильтр по цене -->
        <div class="filter-group">
            <label>Price Range</label>
            <div>
                <label><input type="checkbox" name="price" value="0-100"> $0 - $100</label>
                <label><input type="checkbox" name="price" value="100-500"> $100 - $500</label>
                <label><input type="checkbox" name="price" value="500-1000"> $500 - $1000</label>
                <label><input type="checkbox" name="price" value="1000-2000"> $1000 - $2000</label>
                <label><input type="checkbox" name="price" value="2000+"> $2000+</label>
            </div>
        </div>

        <!-- Фильтр по бренду -->
        <div class="filter-group">
            <label>Brand</label>
            <div>
                <label><input type="checkbox" name="brand" value="Apple"> Apple</label>
                <label><input type="checkbox" name="brand" value="Samsung"> Samsung</label>
                <label><input type="checkbox" name="brand" value="Xiaomi"> Xiaomi</label>
            </div>
        </div>

        <!-- Фильтр по RAM (только для ноутбуков и телефонов) -->
        <div class="filter-group" id="ram-filter-group">
            <label>RAM</label>
            <div>
                <label><input type="checkbox" name="ram" value="4 GB"> 4 GB</label>
                <label><input type="checkbox" name="ram" value="6 GB"> 6 GB</label>
                <label><input type="checkbox" name="ram" value="8 GB"> 8 GB</label>
                <label><input type="checkbox" name="ram" value="12 GB"> 12 GB</label>
                <label><input type="checkbox" name="ram" value="16 GB"> 16 GB</label>
                <label><input type="checkbox" name="ram" value="32 GB"> 32 GB</label>
            </div>
        </div>

        <!-- Фильтр по хранилищу (только для ноутбуков и телефонов) -->
        <div class="filter-group" id="storage-filter-group">
            <label>Storage</label>
            <div>
                <label><input type="checkbox" name="storage" value="64 GB"> 64 GB</label>
                <label><input type="checkbox" name="storage" value="128 GB"> 128 GB</label>
                <label><input type="checkbox" name="storage" value="256 GB"> 256 GB</label>
                <label><input type="checkbox" name="storage" value="512 GB"> 512 GB</label>
                <label><input type="checkbox" name="storage" value="1 TB"> 1 TB</label>
            </div>
        </div>

        <!-- Фильтр по процессору (только для ноутбуков и телефонов) -->
        <div class="filter-group" id="processor-filter-group">
            <label>Processor</label>
            <div>
                <label><input type="checkbox" name="processor" value="Intel Core i5"> Intel Core i5</label>
                <label><input type="checkbox" name="processor" value="Intel Core i7"> Intel Core i7</label>
                <label><input type="checkbox" name="processor" value="AMD Ryzen 5"> AMD Ryzen 5</label>
                <label><input type="checkbox" name="processor" value="AMD Ryzen 7"> AMD Ryzen 7</label>
                <label><input type="checkbox" name="processor" value="Snapdragon 888"> Snapdragon 888</label>
                <label><input type="checkbox" name="processor" value="Apple A15"> Apple A15</label>
            </div>
        </div>

        <!-- Фильтр по цвету -->
        <div class="filter-group">
            <label>Color</label>
            <div>
                <label><input type="checkbox" name="color" value="Black"> Black</label>
                <label><input type="checkbox" name="color" value="White"> White</label>
                <label><input type="checkbox" name="color" value="Silver"> Silver</label>
            </div>
        </div>
    </aside>

    <!-- Основная секция с карточками товаров -->
    <section class="product-section">
        <!-- Сортировка справа сверху -->
        <div class="sort-options">
            <label for="sort-by">Sort By:</label>
            <select id="sort-by">
                <option value="price-asc">Price (Low to High)</option>
                <option value="price-desc">Price (High to Low)</option>
                <option value="brand">Brand (A-Z)</option>
                <option value="model">Model (A-Z)</option>
            </select>
        </div>

        <!-- Индикатор загрузки -->
        <div id="loading" style="display: none;">
            Loading...
        </div>

        <!-- Секция карточек товаров -->
        <div class="product-list" id="product-list">
            <!-- Карточки будут вставлены сюда динамически -->
        </div>

        <!-- Пагинация -->
        <div class="pagination" id="pagination">
            <!-- Кнопки пагинации будут вставлены сюда динамически -->
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2023 Product Catalog. All rights reserved.</p>
</footer>

<script src="./js/index.js"></script>
</body>
</html>
