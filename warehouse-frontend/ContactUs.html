<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/ContactUs.css">
    <link rel="stylesheet" href="css/navBar.css">
</head>
<body class="contact-page">
<nav class="navbar">
    <div class="logo">
        <a href="index.html">Marketplace</a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shoppingСart.html">Cart</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="ContactUs.html">Contact Us</a></li>
        <li class="admin-link" id="admin-link" style="display: none;">
            <a href="admin.html">Admin Panel</a>
        </li>
        <li><a href="LogIn.html" id="login-link">Log In</a></li>
        <li><a href="SignUp.html" id="signup-link">Sign Up</a></li>
        <li><a href="#" id="logout-link" style="display: none;">Log Out</a></li>
    </ul>
</nav>

<header>
    <h1>Contact Us</h1>
</header>
<div class="contact-container">
    <form id="contactForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-group">
            <label for="attachment">Attach a file (optional):</label>
            <input type="file" id="attachment" name="attachment">
        </div>

        <button type="submit" class="submit-btn">Send</button>
    </form>

    <div id="responseMessage" class="response-message"></div>
</div>
<footer>
    <p>&copy; 2023 Product Catalog. All rights reserved.</p>
</footer>
<script src="./js/navbar.js" defer></script>
<script src="./js/ContactUs.js"></script>
</body>
</html>
