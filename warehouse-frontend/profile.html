    <link rel="stylesheet" href="css/navBar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<nav class="navbar">
    <div class="logo">
        <a href="index.html">Marketplace</a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>

    </ul>

<header>
    <h1>User Profile</h1>
</header>
<div class="profile-container">
    <form id="update-profile-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="current-password">Current Password:</label>
        <input type="password" id="current-password" name="current_password"><br><br>
        <label for="new-password">New Password:</label>
        <input type="password" id="new-password" name="new_password"><br><br>
        <label for="confirm-new-password">Confirm New Password:</label>
        <input type="password" id="confirm-new-password" name="confirm_new_password"><br><br>
        <button type="submit">Update Profile</button>
    </form>
    <pre id="profile-response"></pre>
</div>
<script src="./js/navbar.js" defer></script>
<script src="./js/profile.js"></script>
</body>
</html>
