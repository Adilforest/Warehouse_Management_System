</head>
<body>
<nav class="navbar">
    <div class="logo">
        <a href="index.html">Marketplace</a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shoppingСart.html">Cart</a></li>
        <li><a href="profile.html">Profile</a></li>

            <a href="admin.html">Admin Panel</a>
        </li>
        <li><a href="LogIn.html" id="login-link">Log In</a></li>
        <li><a href="SignUp.html" id="signup-link">Sign Up</a></li>
        <li><a href="#" id="logout-link" style="display: none;">Log Out</a></li>
    </ul>

<main>
    <h1>Your Shopping Cart</h1>
    <div id="cart-container"></div>
    <!-- Форма оплаты (скрыта по умолчанию) -->
    <div id="payment-form" style="display: none; margin-top: 20px;">
        <h2>Payment Details</h2>
        <form id="payment-details-form">
            <label for="cardNumber">Card Number:</label><br>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="4123 4567 8901 2345" required><br>
            <label for="expirationDate">Expiration Date (MM/YY):</label><br>
            <input type="text" id="expirationDate" name="expirationDate" required><br>
            <label for="cvv">CVV:</label><br>
            <input type="text" id="cvv" name="cvv" required><br>
            <label for="name">Cardholder Name:</label><br>
            <input type="text" id="name" name="name" required><br>
            <label for="address">Billing Address:</label><br>
            <input type="text" id="address" name="address" required><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <button type="submit">Submit Payment</button>
        </form>
    </div>
</main>
<script src="./js/shoppingCart.js"></script>
<script src="./js/navbar.js" defer></script>
</body>
