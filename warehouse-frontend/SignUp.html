<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/navBar.css">
</head>
<body>
<nav class="navbar">
    <div class="logo">
        <a href="index.html">Marketplace</a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shoppingCart.html">Cart</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="ContactUs.html">Contact Us</a></li>
        <li class="admin-link" id="admin-link" style="display: none;">
            <a href="admin.html">Admin Panel</a>
        </li>
        <li><a href="LogIn.html" id="login-link">Log In</a></li>
        <li><a href="SignUp.html" id="signup-link">Sign Up</a></li>
        <li><a href="#" id="logout-link" style="display: none;">Log Out</a></li>
    </ul>
</nav>
<div class="signup-container">
    <h1>Sign Up</h1>
    <form id="signup-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm_password" required><br><br>
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="LogIn.html">Log In</a></p>
    <pre id="signup-response"></pre>
</div>
<script src="./js/navbar.js" defer></script>
<script src="./js/auth.js"></script>
</body>
</html>
